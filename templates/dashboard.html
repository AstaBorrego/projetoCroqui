<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Croqui</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Barra Superior -->
    <header class="bar bg-dark">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Painel de Croqui (<span id="userRoleDisplay">A carregar...</span>)</h2>
            <div>
                <span id="userEmailDisplay" style="margin-right: 15px; font-weight: bold;"></span>
                <button onclick="window.fazerLogout()" class="btn-danger" style="padding: 5px 10px; cursor: pointer;">Sair</button>
            </div>
        </div>
    </header>

    <!-- Abas dos Colaboradores (Exclusivo do Administrador) -->
    <div id="adminTabsContainer" class="tabs-container" style="display: none;">
        <span style="font-weight: bold; align-self: center; margin-right: 10px;">Colaboradores:</span>
        <div id="tabsHeader" style="display: flex; gap: 8px;"></div>
    </div>

    <!-- Container Principal com Layout de 3 Colunas -->
    <div class="workspace-container">
        
        <!-- 🗨️ LADO ESQUERDO: Chat em Tempo Real -->
        <div class="sidebar-left">
            <h3>Chat em Tempo Real</h3>
            <div id="chatMessages" class="chat-box"></div>
            <div class="chat-input">
                <input type="text" id="msgInput" placeholder="Sua mensagem...">
                <button id="sendBtn">Enviar</button>
            </div>
        </div>

        <!-- 🖼️ CENTRO: Área do Croqui Centralizada -->
        <div class="editor-area-center">
            <h3>Croqui: <span id="currentCroquiTitle">Meu Croqui</span></h3>
            <div class="canvas-wrapper">
                <canvas id="croquiCanvas" width="650" height="480"></canvas>
            </div>
            <div class="actions">
                <button type="button" id="clearBtn" class="btn-danger">Limpar Canvas</button>
                <button type="button" id="approveBtn" class="btn-success" style="display: none;">Aprovar e Salvar Croqui</button>
            </div>
        </div>

        <!-- 🛠️ LADO DIREITO: Ferramentas de Desenho -->
        <div class="sidebar-right">
            <h3>Ferramentas</h3>
            <div class="vertical-toolbar">
                <button type="button" class="tool-btn active" data-tool="pencil">✏️ Lápis</button>
                <button type="button" class="tool-btn" data-tool="brush">🖌️ Pincel</button>
                <button type="button" class="tool-btn" data-tool="line">📏 Linha</button>
                <button type="button" class="tool-btn" data-tool="rect">🔲 Retângulo</button>
                <button type="button" class="tool-btn" data-tool="circle">⭕ Círculo</button>
                <button type="button" class="tool-btn" data-tool="text">🔤 Texto</button>
                <button type="button" class="tool-btn" data-tool="eraser">🧽 Borracha</button>

                <hr class="divider">

                <div class="control-group">
                    <label for="colorPicker">Cor do Traço:</label>
                    <input type="color" id="colorPicker" value="#000000">
                </div>

                <div class="control-group">
                    <label for="lineWidth">Espessura:</label>
                    <input type="range" id="lineWidth" min="1" max="25" value="3">
                </div>

                <hr class="divider">

                <button type="button" id="undoBtn" class="action-btn">↩️ Desfazer</button>
            </div>
        </div>

    </div>

<!-- Módulos JavaScript -->
    <script type="module" src="{{ url_for('static', filename='login.js') }}"></script>
    <script type="module" src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
</body>
</html>
