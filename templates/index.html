<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso ao Sistema</title>
    <link rel="icon" href="{{ url_for('static', filename='image/logo_iar.jpeg') }}" type="image/jpeg">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=4">
</head>
<body class="login-body">
    <div class="login-card">
        <h2>Acesso ao Sistema</h2>
        
        <!-- Elemento de exibição de erros/alertas de login -->
        <div id="errorMsg" style="color: red; font-size: 13px; text-align: center; margin-bottom: 10px; font-weight: bold;"></div>

        <form id="loginForm">
            <div class="input-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="Seu e-mail" required autocomplete="username">
            </div>

            <div class="input-group">
                <label for="password">Senha</label>
                <input type="password" id="password" placeholder="Sua senha" required autocomplete="current-password">
            </div>

            <div class="input-group">
                <label for="userRole">Perfil de Acesso</label>
                <select id="userRole">
                    <option value="campo">Colaborador em Campo</option>
                    <option value="admin">Administrador</option>
                </select>
            </div>

            <button type="submit" id="btnLogin" class="btn-primary">Entrar</button>
        </form>
    </div>

    <!-- Scripts com sufixo ?v=4 para forçar atualização no navegador -->
    <script type="module" src="{{ url_for('static', filename='firebase-config.js') }}?v=4"></script>
    <script type="module" src="{{ url_for('static', filename='login.js') }}?v=4"></script>
</body>
</html>
